/* ---------- persistencia (IndexedDB, con respaldo localStorage solo para ajustes) ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('informes-gid',1);r.onupgradeneeded=()=>r.result.createObjectStore('casos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbPut(k,v){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('casos','readwrite');t.objectStore('casos').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){log('No se pudo guardar en el equipo: '+e,'warn');}}

async function idbAll(){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('casos').objectStore('casos').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return [];}}

const nf=(x,d)=>x.toFixed(d).replace('.',',').replace('-','−');
function dms(v,pos,neg){const a=Math.abs(v),g=Math.floor(a),m=Math.floor((a-g)*60),s=(a-g-m/60)*3600;return g+'°'+m+"'"+s.toFixed(2)+'" '+(v>=0?pos:neg);}
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function az(a,b){const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return (Math.atan2(y,x)/r+360)%360;}

function parseGPX(txt){const x=new DOMParser().parseFromString(txt,'application/xml');if(x.querySelector('parsererror'))throw new Error('GPX inválido');const out=[];

function gpxBlocks(){const pts=S.gpx.filter(p=>p.use);if(pts.length<1)return [];const alt=$('#gAlt')&&$('#gAlt').checked;

async function pdfText(f,max){const lib=await pdfjs();const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;const pages=[];for(let i=1;i<=Math.min(doc.numPages,max||60);i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();pages.push(tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n').replace(/\n{3,}/g,'\n\n').trim());}return {n:doc.numPages,pages:pages};}

function classify(nm,txt){const t=(nm+' '+txt.slice(0,4000)).toUpperCase();if(/INFORME POLICIAL DE ACCIDENTE|\bIPAT\b/.test(t))return 'IPAT';if((/OUTLOOK|ARCHIVOS ADJUNTOS/.test(t)||(/^\s*(DESDE|DE:|FROM)\b[^\n]*[<@]/m.test(t)&&/^\s*PARA\b/m.test(t)))&&!/SD-P03-F04|FORMULARIO:\s*MISI/.test(t))return 'Correo';if(/MISI[ÓO]N DE TRABAJO|SD-P03-F04/.test(t))return 'MT';if(/FPJ-?\d+/.test(t))return 'FPJ';return 'Otro';}

function laboresFrom(t){const i=t.search(/\n\s*5\.\s*LABORES/i);if(i<0)return '';const noise=/^(Subproceso|C[óo]digo|Versi[óo]n|Formulario|Grupo de Investigaci|Nota: Una vez|el sitio oficial|P[áa]gina \d+ de|Vigente desde)/i;

 const P=[];L.forEach(x=>{const nw=/^([•·\-–]|[a-z]\)|\d+[.)]\s|CUESTIONARIO)/i.test(x);if(!P.length||nw)P.push(x);else P[P.length-1]+=' '+x;});while(P.length>4){const l=P.pop();P[P.length-1]+=' '+l;}return P.join('\n\n');}

function parseMT(t){const o={};let m,v;const mts=mtList(t);if(mts.length){o.mts=mts;if(mts.length===1)o.mt=mts[0];}

function ipatPrompt(){const L=[];IPAT_G.forEach(g=>g[1].forEach(([id,t])=>L.push(id+': '+t)));return 'Eres perito en accidentes de tránsito en Colombia. Las imágenes son las hojas de un Informe Policial de Accidente de Tránsito (IPAT), con formulario impreso y letra manuscrita. Lee con cuidado cada campo (incluidas casillas marcadas, dobles marcas y enmendaduras). Valida contra la Resolución 11268 de 2012 (compilada en la Resolución 20223040045295 de 2022, Anexos 72 y 73). Reglas: código IPAT en papel = 1 letra + 9 dígitos; hora militar; campo 2 una sola casilla; campo 5 solo la clase principal; croquis obligatorio con punto de referencia, medidas, evidencia movida señalada; las hipótesis no implican responsabilidad. NO cites de memoria los códigos de hipótesis ni de infracción: transcríbelos tal como están escritos y marca que deben verificarse en las tablas oficiales. Lo ilegible debe ir como dudoso, nunca inventado. Responde SOLO con un JSON válido, sin texto adicional, con esta forma: {"datos":{"ipat":"","nunc":"","fecha_ocurrencia":"AAAA-MM-DD","hora_ocurrencia":"HH:MM","fecha_levantamiento":"AAAA-MM-DD","hora_levantamiento":"HH:MM","vehiculos":[{"n":1,"placa":"","soat_vence":"AAAA-MM-DD","rtm_vence":"","licencia_vence":""}]},"ficha":"texto de la ficha del evento: lugar, vehículos, conductores, lesionados, daños, hipótesis, comparendo, NUNC y lecturas dudosas","matriz":{"a1":{"s":"ok|w|x|na","n":"nota breve"}},"hallazgos":[{"p":"Alta|Media|Baja","t":"campo · evidencia · por qué importa"}],"preguntas":"preguntas abiertas y documentos a solicitar"}. En "matriz" incluye todos estos ids con su estado (ok cumple, w dudoso, x no cumple, na no aplica): '+L.join(' | ')+'.';}
function ipatChecks(d){const it=S.ipat.items,out=[];const set=(id,s,n)=>{it[id]={s:s,n:n};};
 if(d.ipat){const c=String(d.ipat).replace(/\s/g,'');if(/^[A-Z]\d{9}$/.test(c))set('a1','ok','Código '+c);else{set('a1','w','Código «'+c+'» no es letra + 9 dígitos');out.push({p:'Media',t:'[Auto] Código IPAT «'+c+'» no cumple letra + 9 dígitos (papel). Verificar si es IPAT electrónico (AE/CE) o error de lectura.'});}}
 if(d.nunc){const n=String(d.nunc).replace(/\D/g,'');if(n.length===21)set('b1','ok','dpto '+n.slice(0,2)+', mpio '+n.slice(2,5)+', entidad '+n.slice(5,7)+', unidad '+n.slice(7,12)+', año '+n.slice(12,16)+', consecutivo '+n.slice(16));else{set('b1','x','NUNC con '+n.length+' dígitos');out.push({p:'Media',t:'[Auto] NUNC con '+n.length+' dígitos; debe tener 21 (dpto 2 + mpio 3 + entidad 2 + unidad 5 + año 4 + consecutivo 5).'});}}
 const dt=(f,h)=>f?new Date(f+'T'+(h||'00:00')):null;const fo=dt(d.fecha_ocurrencia,d.hora_ocurrencia),fl=dt(d.fecha_levantamiento,d.hora_levantamiento);
 if(fo&&fl&&!isNaN(fo)&&!isNaN(fl)){if(fl>=fo)set('b2','ok','Ocurrencia '+d.fecha_ocurrencia+' '+(d.hora_ocurrencia||'')+'; levantamiento '+d.fecha_levantamiento+' '+(d.hora_levantamiento||''));else{set('b2','x','Levantamiento anterior a la ocurrencia');out.push({p:'Alta',t:'[Auto] La fecha/hora de levantamiento es anterior a la de ocurrencia.'});}}
 if(fo&&!isNaN(fo)){[['soat_vence','b3','SOAT'],['rtm_vence','b4','RTM'],['licencia_vence','b5','Licencia']].forEach(([k,id,nm])=>{const vs=(d.vehiculos||[]).filter(v=>v[k]);if(!vs.length)return;const bad=vs.filter(v=>{const x=new Date(v[k]+'T23:59');return !isNaN(x)&&x<fo;});if(bad.length){set(id,'x',nm+' vencido(a) a la fecha del accidente: '+bad.map(v=>(v.placa||('veh. '+v.n))+' '+v[k]).join(', '));out.push({p:'Alta',t:'[Auto] '+nm+' vencido(a) el día del accidente: '+bad.map(v=>(v.placa||('veh. '+v.n))+' (vence '+v[k]+')').join(', ')+'. Verificar en el RUNT.'});}else set(id,'ok',nm+' vigente: '+vs.map(v=>(v.placa||('veh. '+v.n))+' '+v[k]).join(', '));});}
 return out;}
function pageList(s,max){const o=new Set();String(s||'1').split(',').forEach(p=>{const m=p.trim().match(/^(\d+)(?:-(\d+))?$/);if(m){const a=+m[1],b=+(m[2]||m[1]);for(let i=a;i<=Math.min(b,a+11);i++)o.add(i);}});return [...o].filter(i=>i<=max);}

function fillCaso(){S.auto=S.auto||{};const got={};const mtDocs=EXT.filter(e=>e.kind==='MT');

 if(!confirm('Se enviarán '+ks.length+' imagen(es), reducidas, a la API de Claude (Anthropic) con tu clave. Pueden mostrar personas, placas o direcciones. ¿Continuar?'))return;
 const model=lsGet('gid_aimodel')||'claude-sonnet-5-5';const out=[];
 try{for(let i=0;i<ks.length;i+=6){const ch=ks.slice(i,i+6);imStat('Analizando imágenes '+(i+1)+'–'+(i+ch.length)+' de '+ks.length+'…');const b64=await Promise.all(ch.map(k=>smallJpeg(S.imgs[k].data,1400)));
   const content=[];b64.forEach((d,j)=>{content.push({type:'text',text:'Imagen '+(j+1)+':'});content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}});});content.push({type:'text',text:imgPrompt(ch.length)});
   const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':lsGet('gid_apikey').trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:model,max_tokens:4000,messages:[{role:'user',content:content}]})});
   const j=await r.json();if(!r.ok)throw new Error(apiErr(r,j));const txt=(j.content||[]).map(c=>c.text||'').join('');const a=txt.indexOf('{'),e=txt.lastIndexOf('}');if(a<0||e<a)throw new Error('La respuesta no trajo JSON.');
   const o=JSON.parse(txt.slice(a,e+1));const got=new Set();(o.items||[]).forEach(it=>{const k=ch[(+it.n)-1];if(!k||got.has(k))return;got.add(k);out.push({k:k,tipo:['foto','plano','mapa','croquis','otro'].includes(it.tipo)?it.tipo:guessTipo(S.imgs[k].name||''),titulo:String(it.titulo||'').slice(0,120),pie:String(it.pie||'').slice(0,300),descripcion:String(it.descripcion||'').slice(0,900)});});
   ch.forEach(k=>{if(!out.some(x=>x.k===k))out.push({k:k,tipo:guessTipo(S.imgs[k].name||''),titulo:'',pie:'',descripcion:''});});}
  const c=colocar(out);dirty();render();imStat('Listo: '+c.foto+' foto(s), '+c.mapa+' mapa(s), '+c.croquis+' croquis y '+c.plano+' plano(s) colocados. Revisa pies y descripciones («IA: revisar»).');}
 catch(e){imStat('Error: '+e.message);if(out.length){const c=colocar(out);dirty();render();imStat('Error a mitad: '+e.message+'. Se colocaron las '+out.length+' ya analizadas.');}}}
function insLocal(){const ks=sinUsar();if(!ks.length)return;const c=colocar(ks.map(k=>({k:k,tipo:guessTipo(S.imgs[k].name||''),titulo:S.imgs[k].name||'',pie:'[[pie de imagen]]',descripcion:''})));dirty();render();imStat('Colocadas '+ks.length+' imagen(es) sin IA, con pie pendiente [[…]].');}

 clearTimeout(saveT);

function titleCase(s){return s.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());}

function comTexto(){const pr=PRESETS[S.tipo],os=S.osndp.nombre.trim()||'[[nombre del O.S.N.D.P.]]';
 if(pr.motivo==='logistica'){const f=S.com.fecha?fechaLarga(S.com.fecha):'[[fecha de la comisión]]';if(S.com.estado==='tentativa')return 'Respetuosamente se le informa al Sr. O.S.N.D.P. '+os+', que, por trámites de carácter administrativo, la consecución de la logística de vehículo y desplazamiento, a la fecha no se ha asignado fecha de comisión; la diligencia se tiene proyectada de manera tentativa para el '+f+' de la presente anualidad, sujeta a la asignación de la comisión.';return 'Respetuosamente se le informa al Sr. O.S.N.D.P. '+os+', que, por trámites de carácter administrativo, la consecución de la logística de vehículo y desplazamiento, la diligencia se tiene proyectada para el '+f+' de la presente anualidad.';}
 const fc=(S.fecha||'').split('-'),mes=fc.length===3?MESES[+fc[1]-1]+' de '+fc[0]:'[[mes y año]]',us=S.usuario.trim()?titleCase(S.usuario.trim()):'[[usuario]]',lab=S.com.labores.trim()||'[[labores de la MT, p. ej. labores investigativas, de inspección técnica y fijación del lugar]]',memo=S.com.memo.trim()||'[[radicado del memorando]]',sec=S.com.sector.trim()||'[[sector o corredor afectado]]';
 return 'En atención a la Misión de Trabajo No. '+(S.mt||'[[MT]]')+', orientada a adelantar '+lab+' en favor del usuario '+us+', me permito comunicarle que, lamentablemente, por estrictas razones logísticas y de seguridad asociadas al sector donde debe surtirse la diligencia, a la fecha no se ha logrado conseguir la aprobación ni la asignación de vehículo oficial para el desplazamiento de la comisión.\n\nPor consiguiente, y ante la imposibilidad material de ingresar de forma segura al área en este momento, es imperativo que por su conducto se proceda a solicitar ante el Grupo de Investigación Defensorial del Valle, e-mail: invdef.valle@defensoria.edu.co y al despacho judicial correspondiente, aprobar una ampliación de términos para la entrega de los informes periciales y de investigación. Lo anterior, con el fin de salvaguardar el debido proceso y asegurar que las labores de defensa técnica no se vean menoscabadas por contingencias externas ajenas a nuestra voluntad.\n\n## Orden Público, Recomendaciones e Instrucciones de Desplazamiento\n\nEl monitoreo de seguridad en el corredor que interconecta a '+sec+' evidencia una crítica vulnerabilidad para las comisiones en terreno debido al control territorial intermitente y al establecimiento de retenes ilegales por parte de Grupos Armados Organizados (GAO-r).\n\nConforme a lo advertido en el Memorando institucional con Radicado No. '+memo+', la persistencia de estas alteraciones de orden público en el sector genera riesgos severos y recurrentes contra la vida, la integridad física y la libertad de locomoción de los servidores de la Defensoría del Pueblo.\n\nAnte este escenario restrictivo que se mantienen a la fecha de '+mes+', se dictan directrices imperativas de autoprotección que prohíben estrictamente efectuar traslados misionales en vehículos particulares o que carezcan del blindaje oficial asignado y la validación perimetral de la entidad. Asimismo, se restringe cualquier aproximación al terreno fuera del horario seguro (establecido estrictamente entre las 08:00 y las 15:00 horas), ordenando la aplicación prioritaria de la Resolución 1966 de 2023 para coordinar y articular las capacidades técnicas entre la Regional Cauca y la Regional Valle del Cauca, mitigando así trayectos prolongados en zonas de conflicto.\n\nLas actividades de campo y pericias especializadas que involucren inspecciones técnicas, fijación fotográfica o planimetría del lugar de los hechos continuarán bajo estricta coordinación del Grupo de Investigación para la Defensa (GID), supeditadas a que la administración garantice los recursos vehiculares oficiales y bajo el monitoreo continuo del Profesional Administrativo y de Gestión Supervisor, Dr. Hernando Ordóñez Ramírez.';}
function vCom(){const pr=PRESETS[S.tipo],lg=pr.motivo==='logistica';return '<div class="card"><h2>'+esc(pr.nombre)+'</h2>'+(lg?'<label>Estado de la fecha de comisión</label><select data-p="com.estado"><option value="asignada"'+(S.com.estado!=='tentativa'?' selected':'')+'>Fecha asignada (según el pantallazo)</option><option value="tentativa"'+(S.com.estado==='tentativa'?' selected':'')+'>Sin fecha asignada: usar fecha tentativa</option></select>'+field(S.com.estado==='tentativa'?'Fecha tentativa de la comisión':'Fecha programada de la comisión (según el pantallazo)','com.fecha','date'):field('Radicado del memorando de orden público','com.memo')+field('Sector o corredor afectado','com.sector')+area('Labores de la MT (para la primera frase)','com.labores',2))+'<button class="b" id="cgen">Generar texto de «Labores realizadas»</button><p class="note">Los datos del caso (usuario, O.S.N.D.P., supervisor, fecha del informe) se toman de la pestaña Caso. Los textos en el informe de referencia de orden público (MT2026-00400) son del sector Cauca/Valle: verifica que el memorando y el corredor sigan vigentes.</p></div><div class="card"><h2>Labores realizadas (texto del informe)</h2>'+area('Separa los párrafos con una línea en blanco; una línea que empiece con «## » sale en negrita como subtítulo.','cuerpo',14)+'</div><div class="card"><h2>Anexos</h2><textarea id="anexos" rows="3">'+esc(S.anexos.join('\n'))+'</textarea><p class="note">Déjalo vacío para «ANEXOS: N/A» (como en 00805, 00791 y 00400).</p></div>';}
function render(){const m=$('#main');const y=window.scrollY;if(isCom()&&['ins','ipat','cont'].includes(TAB))TAB='com';if(!isCom()&&TAB==='com')TAB='caso';m.innerHTML=({asist:vAsist,caso:vCaso,com:vCom,ins:vInsumos,ipat:vIpat,cont:vContenido,jur:vJur,gen:vGen})[TAB]();$('#nav').innerHTML=(isCom()?TABS_COM:TABS).map(t=>'<button data-tab="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'">'+t[1]+'</button>').join('')+'<button id="nuevo" title="Empezar un informe en ceros">➕ Nuevo informe</button>';window.scrollTo(0,y);if(TAB==='asist')listCasos();if(TAB==='gen')refreshMail();}

 if(d.a){const b=t.closest('.blk'),s=b.dataset.s,i=+b.dataset.i,a=S[s];if(d.a==='del'){a.splice(i,1);}else if(d.a==='up'&&i>0){[a[i-1],a[i]]=[a[i],a[i-1]];}else if(d.a==='dn'&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];}dirty();render();return;}

 if(d.cdel!=null){S.conclusiones.splice(+d.cdel,1);dirty();render();return;}
 if(d.rot){await rotImg(d.rot);dirty();render();return;}
 if(d.rm){if(confirm('¿Quitar la imagen?')){delete S.imgs[d.rm];dirty();render();}return;}
 if(t.id==='gIns'){const bl=gpxBlocks();if(!bl.length){alert('Selecciona al menos un punto.');return;}S.resultados.push(...bl);dirty();log('Tablas del GPX insertadas al final de Resultados; reordénalas en Contenido.','ok');TAB='cont';render();return;}
