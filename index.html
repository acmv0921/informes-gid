<script>'use strict';
const $=s=>document.querySelector(s);

function log(m,c){const l=$('#log');if(!l)return;const d=document.createElement('div');d.className=c||'';d.textContent=new Date().toLocaleTimeString()+'  '+m;l.prepend(d);}
/* ---------- persistencia (IndexedDB, con respaldo localStorage solo para ajustes) ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('informes-gid',1);r.onupgradeneeded=()=>r.result.createObjectStore('casos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbPut(k,v){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('casos','readwrite');t.objectStore('casos').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){log('No se pudo guardar en el equipo: '+e,'warn');}}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('casos').objectStore('casos').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return null;}}
async function idbAll(){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('casos').objectStore('casos').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return [];}}
async function idbDel(k){try{const db=await idb();db.transaction('casos','readwrite').objectStore('casos').delete(k);}catch(e){}}
let saveT=null;function dirty(){clearTimeout(saveT);saveT=setTimeout(()=>{idbPut('actual',S);if(S.mt)idbPut('caso:'+S.mt,S);},700);}
function cfgGet(k,d){try{return localStorage.getItem('gid_'+k)||d;}catch(e){return d;}}
function cfgSet(k,v){try{localStorage.setItem('gid_'+k,v);}catch(e){}}
/* ---------- formato numérico ---------- */
const nf=(x,d)=>x.toFixed(d).replace('.',',').replace('-','−');
function dms(v,pos,neg){const a=Math.abs(v),g=Math.floor(a),m=Math.floor((a-g)*60),s=(a-g-m/60)*3600;return g+'°'+m+"'"+s.toFixed(2)+'" '+(v>=0?pos:neg);}
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function az(a,b){const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return (Math.atan2(y,x)/r+360)%360;}
function rumbo(d){return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'][Math.round(d/22.5)%16];}
/* ---------- GPX ---------- */
function parseGPX(txt){const x=new DOMParser().parseFromString(txt,'application/xml');if(x.querySelector('parsererror'))throw new Error('GPX inválido');const out=[];
 x.querySelectorAll('wpt').forEach(w=>{const e=w.querySelector('ele'),n=w.querySelector('name'),t=w.querySelector('time');out.push({name:n?n.textContent:'Punto',lat:+w.getAttribute('lat'),lon:+w.getAttribute('lon'),ele:e?+e.textContent:null,time:t?t.textContent:'',use:true,src:'GPS Garmin'});});
 if(!out.length)throw new Error('El GPX no trae waypoints (wpt). Los tracks no se convierten en tabla.');return out;}
function gpxBlocks(){const pts=S.gpx.filter(p=>p.use);if(pts.length<1)return [];const alt=$('#gAlt')&&$('#gAlt').checked;
 const key=n=>'g'+n;const hdr=['Punto','Fuente'].concat(['Lat. (°)','Long. (°)']).concat(alt?['Alt. (m)']:[]);

function loadImg(file,maxd){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,maxd/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res({data:c.toDataURL('image/jpeg',0.86),w:c.width,h:c.height});};im.onerror=()=>rej(new Error('No se pudo leer '+file.name));im.src=u;});}

function vCaso(){return '<div class="card"><h2>Datos del caso</h2><div class="row"><div>'+field('N° de misión (AAAA-NNNNN)','mt','text','2026-00581')+'</div><div>'+field('N° de informe','informe','text','2026-00581-01')+'</div><div>'+field('Fecha del informe','fecha','date')+'</div></div><div class="row"><div>'+field('SPOA / CUI (21 dígitos)','spoa','text','196986000633202500499')+'</div><div>'+field('Delito','delito')+'</div></div>'+field('Usuario (nombre completo)','usuario')+'</div><div class="card"><h2>O.S.N.D.P. y supervisor</h2><div class="row"><div>'+field('O.S.N.D.P. (con «Dra./Dr.»)','osndp.nombre')+'</div><div>'+field('Departamento','osndp.depto')+'</div><div>'+field('Teléfono','osndp.tel')+'</div><div>'+field('Correo del O.S.N.D.P.','osndp.email','email')+'</div></div>'+field('Supervisor del O.S.N.D.P.','supervisor')+'</div><div class="card"><h2>Labores solicitadas (transcripción literal de la MT)</h2><textarea id="labores" rows="6">'+esc(S.labores.join('\n\n'))+'</textarea><p class="note">Separa cada labor con una línea en blanco (máximo 4).</p></div>';}
function vInsumos(){const g=S.gpx;return '<div class="card"><h2>Cargar carpeta o archivos del caso</h2><p class="note">Elige la carpeta del caso (p. ej. «MT2026-00581 NOMBRE») o varios archivos. Las imágenes entran a la biblioteca, los GPX/KML se leen como puntos, y los demás (PDF, CAD, Word, Excel) quedan en el inventario; de un PDF puedes extraer páginas como imagen. Todo se procesa en tu equipo.</p><label class="b">📁 Cargar carpeta del caso<input type="file" id="fdir" webkitdirectory multiple hidden></label><label class="b s">📎 Cargar archivos<input type="file" id="ffil" multiple hidden></label>'+(S.files.length?'<h3>Inventario de archivos ('+S.files.length+')</h3><table style="width:100%;font-size:13px">'+S.files.map((f,i)=>'<tr><td>'+esc(f.path||f.name)+'</td><td>'+Math.round(f.size/1024)+' KB</td><td>'+(f.ext==="pdf"?'<input type="number" min="1" value="1" id="pp'+i+'" style="width:60px;display:inline"> <button class="b s sm" data-pdf="'+i+'">Página → imagen</button>':'')+'</td></tr>').join('')+'</table><button class="b d sm" id="clrf">Vaciar inventario</button>':'')+'</div><div class="card"><h2>Fotografías, planos y mapas</h2><p class="note">Se reducen y comprimen en tu equipo (no se suben a ningún servidor). Luego las insertas en la pestaña Contenido.</p><input type="file" id="fimg" accept="image/*" multiple><div class="thumbs" style="margin-top:10px">'+Object.keys(S.imgs).map(k=>'<div class="th"><img src="'+S.imgs[k].data+'"><div>'+k+'<br>'+esc(S.imgs[k].name)+'</div><button class="b s sm" data-rot="'+k+'">Girar 90°</button><button class="b d sm" data-rm="'+k+'">Quitar</button></div>').join('')+'</div></div>'
 +'<div class="card"><h2>Archivo GPX (GPS Garmin)</h2><input type="file" id="fgpx" accept=".gpx,application/gpx+xml,text/xml"><p class="note">Se leen los waypoints. Se generan la tabla de coordenadas y la de distancias/azimut (Haversine) en Resultados.</p>'
 +(g.length?'<table style="width:100%;font-size:13px"><tr><th></th><th>Nombre</th><th>Lat</th><th>Lon</th><th>Alt</th><th>Fuente</th></tr>'+g.map((p,i)=>'<tr><td><input type="checkbox" data-gu="'+i+'"'+(p.use?' checked':'')+'></td><td><input data-gn="'+i+'" value="'+esc(p.name)+'"></td><td>'+nf(p.lat,6)+'</td><td>'+nf(p.lon,6)+'</td><td>'+(p.ele==null?'—':Math.round(p.ele))+'</td><td><input data-gs="'+i+'" value="'+esc(p.src)+'"></td></tr>').join('')+'</table><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="gAlt" style="width:auto">¿El GPS tuvo corrección RTK? (solo entonces se incluye la altitud)</label><button class="b" id="gIns">Insertar tablas en Resultados</button>':'')+'</div>';}
function vContenido(){numbering();return '<div class="card"><h2>Metodología, nota y lugar</h2>'+area('Nota metodológica','nota',4)+area('Lugar y fecha de la diligencia','lugar',6)+area('Metodología','metodologia',3)+'<h3>Instrumentos (5)</h3>'+S.instrumentos.map((_,i)=>area('Instrumento '+(i+1),'instrumentos.'+i,2)).join('')+'<h3>Insumos (3)</h3>'+S.insumos.map((_,i)=>area('Insumo '+(i+1),'insumos.'+i,3)).join('')+'</div>'
 +SECS.map(([sec,tt])=>'<div class="card"><h2>'+tt+'</h2><p class="note">Referencias cruzadas: escribe {{clave}} (de una imagen o tabla), {{osndp}}, {{usuario}}, {{mt}} o {{informe}}; el motor las reemplaza por «Imagen N°…», «Tabla N°…», etc.</p>'+S[sec].map((b,i)=>blockHTML(sec,i,b)).join('')+'</div>'+addBar(sec)).join('')
 +'<div class="card"><h2>Conclusiones</h2>'+S.conclusiones.map((c,i)=>'<div class="blk" data-c="'+i+'"><div class="h"><b>'+esc(c.label)+'</b><button class="b d sm" data-cdel="'+i+'">Eliminar</button></div><textarea data-ct="'+i+'" rows="4">'+esc(c.text)+'</textarea></div>').join('')+'<button class="b s" id="cadd">Agregar conclusión</button></div>'
 +'<div class="card"><h2>Anexos (solo se enumeran los planos)</h2><textarea id="anexos" rows="4">'+esc(S.anexos.join('\n'))+'</textarea><p class="note">Una línea por anexo.</p></div>';}
function vGen(){const er=validate(),pd=pending();return '<div class="card"><h2>Revisión previa</h2>'+(er.length?'<p class="bad">'+er.map(esc).join('<br>')+'</p>':'<p class="ok">Datos obligatorios completos.</p>')+(pd.length?'<p class="warn">'+pd.length+' campos pendientes [[…]]: '+esc(pd.slice(0,6).join(' · '))+(pd.length>6?' …':'')+'</p>':'<p class="ok">Sin campos pendientes.</p>')+'<p class="note">Al abrir el .docx en Word, acepta «actualizar campos» para que las listas de figuras y tablas muestren sus páginas. Revisa el marco y el cajetín página por página antes de enviar.</p></div>'
 +'<div class="card"><h2>Generar</h2><button class="b" id="g06">Generar F06 (.docx)</button><button class="b" id="g82">Generar F82 (.docx)</button><button class="b s" id="gBoth">Ambos</button></div>'
 +'<div class="card"><h2>Correo de entrega</h2>'+'<label>Enlace de la encuesta del GID (se guarda en este equipo)</label><input id="enc" value="'+esc(cfgGet('encuesta',''))+'" placeholder="https://…"><pre id="mail"></pre><button class="b s" id="cpMail">Copiar texto</button><p class="note">Adjuntos: F06 en PDF, F82 en PDF y planos/mapa en PDF. Para: GID VALLE – Misiones Valle del Cauca; copia al O.S.N.D.P.</p></div>'
 +'<div class="card"><h2>Copia de seguridad</h2><button class="b s" id="exp">Exportar paquete del caso (.json)</button> <label style="display:inline-block"><input type="file" id="imp" accept=".json" style="display:none"><span class="b s" style="display:inline-block;border:1px solid var(--pri);border-radius:9px;padding:9px 14px;cursor:pointer">Importar paquete</span></label></div>'
 +'<div class="card"><h2>Registro</h2><div id="log"></div></div>';}
/* ---------- render y eventos ---------- */

const IPAT_G=[['A. Cumplimiento formal (Res. 11268/2012)',[['a1','Código IPAT (letra + 9 dígitos) legible y repetido en todas las hojas'],['a2','Organismo de tránsito; fecha y hora (militar) de ocurrencia y de levantamiento'],['a3','Gravedad (campo 2): una sola casilla'],['a4','Clase de accidente (campo 5): solo la clase principal'],['a5','Lugar, dirección y coordenadas'],['a6','Sin enmiendas ni doble marca en casillas'],['a7','Firmas de conductores y del agente'],['a8','Testigos, anexos y huellas diligenciados o con constancia de que no existen'],['a9','Es el original (no fotocopia del formato)'],['a10','Croquis presente']]],
['B. Coherencia interna',[['b1','NUNC de 21 dígitos (dpto 2, mpio 3, entidad 2, unidad 5, año 4, consecutivo 5) igual en todas las hojas'],['b2','Ocurrencia anterior al levantamiento'],['b3','SOAT vigente a la fecha del accidente'],['b4','Revisión técnico-mecánica obligatoria y vigente'],['b5','Licencia (categoría y vigencia) acorde al vehículo'],['b6','Clase de accidente, lugar de impacto y daños coherentes'],['b7','Hipótesis, observaciones y comparendo coherentes entre sí'],['b8','Víctimas coherentes con los totales (campo 10)'],['b9','Tipo de documento coherente con el número de identificación'],['b10','Pasajeros/acompañantes en el momento del accidente consignados'],['b11','Prueba de embriaguez/sustancias consistente (sin doble marca, con grado)']]],
['C. Croquis',[['c1','Escala, plano, vista y convenciones'],['c2','Punto de referencia y ejes con sus offsets'],['c3','Tabla de medidas completa (contorno de cada vehículo)'],['c4','Medidas coherentes con las dimensiones reales del vehículo'],['c5','Puntos dentro del ancho de la vía'],['c6','Punto de impacto, huellas y posición final'],['c7','Evidencia movida señalada (línea punteada y nota)']]],
['D. Concordancia con el expediente',[['d1','Constancias y NUNC'],['d2','Fotografías y planos'],['d3','Informes médicos / epicrisis'],['d4','Consulta RUNT (SOAT, RTM, licencias, propietarios)']]]];
const IPAT_S={'':'Sin revisar','ok':'✔ Cumple','w':'⚠ Dudoso','x':'✖ No cumple','na':'N/A'};
function vIpat(){const I=S.ipat;return '<div class="card"><h2>Análisis del IPAT</h2><p class="note">Registra la lectura del IPAT (formulario y manuscrito) y valídalo contra la Resolución 11268 de 2012 (compilada en la Resolución 20223040045295 de 2022, Anexos 72 y 73). Los códigos de hipótesis e infracción no se citan de memoria: verifícalos en las tablas oficiales. Carga el PDF o las fotos del IPAT en la pestaña Insumos para consultarlos.</p>'+field('N.° del IPAT','ipat.num','text','A001402426')+area('Ficha del evento (fecha, lugar, vehículos, conductores, lesionados, hipótesis, comparendo, NUNC y lecturas dudosas)','ipat.ficha',8)+'</div>'
+IPAT_G.map(g=>'<div class="card"><h2>'+g[0]+'</h2>'+g[1].map(([id,t])=>'<div class="blk"><div>'+esc(t)+'</div><select data-ip="'+id+'">'+Object.keys(IPAT_S).map(k=>'<option value="'+k+'"'+((I.items[id]||{}).s===k||(!(I.items[id])&&k==='')?' selected':'')+'>'+IPAT_S[k]+'</option>').join('')+'</select><input data-ipn="'+id+'" placeholder="Nota / evidencia" value="'+esc((I.items[id]||{}).n||'')+'"></div>').join('')+'</div>').join('')
+'<div class="card"><h2>Hallazgos e inconsistencias</h2>'+I.hall.map((h,i)=>'<div class="blk"><div class="h"><select data-ihp="'+i+'">'+['Alta','Media','Baja'].map(p=>'<option'+(h.p===p?' selected':'')+'>'+p+'</option>').join('')+'</select><button class="b d sm" data-ihd="'+i+'">Eliminar</button></div><textarea data-iht="'+i+'" rows="3" placeholder="Campo · evidencia · por qué importa">'+esc(h.t)+'</textarea></div>').join('')+'<button class="b s" id="ihAdd">Agregar hallazgo</button></div>'
+'<div class="card"><h2>Preguntas abiertas y documentos a solicitar</h2><textarea id="ipreg" rows="4">'+esc(I.preg)+'</textarea><button class="b" id="ipIns">Insertar análisis en Interpretación del informe</button><p class="note">Agrega al final de Interpretación: ficha, puntos dudosos o incumplidos de la matriz, hallazgos por prioridad y preguntas abiertas. Luego puedes editarlo en Contenido.</p></div>';}
function ipatBlocks(){const I=S.ipat,B=(t,x)=>({t:t,text:x});const o=[B('bold','Análisis del Informe Policial de Accidente de Tránsito'+(I.num?' N.° '+I.num:'')+':')];if(I.ficha.trim())o.push(B('body',I.ficha.trim()));
const f=[];IPAT_G.forEach(g=>g[1].forEach(([id,t])=>{const it=I.items[id];if(it&&(it.s==='w'||it.s==='x'))f.push((it.s==='x'?'No cumple: ':'Dudoso: ')+t+(it.n?' — '+it.n:'')+'.');}));
if(f.length){o.push(B('body','Validación frente a la Resolución 11268 de 2012:'));f.forEach(x=>o.push(B('body','- '+x)));}
if(I.hall.length){o.push(B('body','Hallazgos e inconsistencias (por prioridad):'));['Alta','Media','Baja'].forEach(p=>I.hall.filter(h=>h.p===p&&h.t.trim()).forEach((h,n)=>o.push(B('body','['+p+'] '+h.t.trim()))));}
if(I.preg.trim())o.push(B('body','Preguntas abiertas: '+I.preg.trim()));o.push({t:'blank'});return o;}
const TABS=[['asist','Asistente'],['caso','Caso'],['ins','Insumos'],['ipat','IPAT'],['cont','Contenido'],['gen','Generar']];
function render(){const m=$('#main');const y=window.scrollY;m.innerHTML=({asist:vAsist,caso:vCaso,ins:vInsumos,ipat:vIpat,cont:vContenido,gen:vGen})[TAB]();$('#nav').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'">'+t[1]+'</button>').join('');window.scrollTo(0,y);if(TAB==='asist')listCasos();if(TAB==='gen')refreshMail();}
function refreshMail(){const e=$('#mail');if(!e)return;try{const m=emailText();e.textContent='Asunto: '+m.asunto+'\n\n'+m.cuerpo;}catch(x){e.textContent='Completa el caso para generar el correo.';}}
async function listCasos(){const k=(await idbAll()).filter(x=>String(x).startsWith('caso:'));const e=$('#casos');if(!e)return;e.innerHTML=k.length?k.map(x=>'<button class="b s sm" data-open="'+esc(x)+'">'+esc(String(x).slice(5))+'</button><button class="b d sm" data-delc="'+esc(x)+'">×</button>').join(' '):'Aún no hay casos guardados.';}
function applyPreset(){const p=PRESETS[S.tipo];if(S.resultados.length&&!confirm('Esto reemplaza el contenido actual de Resultados, Interpretación y Conclusiones. ¿Continuar?'))return;const c=JSON.parse(JSON.stringify(p));['labores','nota','lugar','instrumentos','metodologia','insumos','resultados','interpretacion','conclusiones','anexos'].forEach(k=>{if(k==='labores'&&S.labores.some(x=>x.trim()))return;S[k]=c[k];});dirty();log('Plantilla «'+p.nombre+'» aplicada.','ok');TAB='caso';render();}
document.addEventListener('click',async ev=>{const t=ev.target.closest('button,[data-tab]');if(!t)return;const d=t.dataset;
 if(d.tab){TAB=d.tab;render();return;}
 if(t.id==='aplicar'){applyPreset();return;}
 if(t.id==='ihAdd'){S.ipat.hall.push({p:'Media',t:''});dirty();render();return;}
 if(d.ihd!=null){S.ipat.hall.splice(+d.ihd,1);dirty();render();return;}
 if(t.id==='ipIns'){S.interpretacion.push(...ipatBlocks());dirty();log('Análisis del IPAT agregado al final de Interpretación.','ok');TAB='cont';render();return;}
 if(d.pdf!=null){const f=S.files[+d.pdf];await pdfPage(f.name,+(($('#pp'+d.pdf)||{}).value||1));return;}
 if(t.id==='clrf'){S.files=[];dirty();render();return;}
 if(d.a){const b=t.closest('.blk'),s=b.dataset.s,i=+b.dataset.i,a=S[s];if(d.a==='del'){a.splice(i,1);}else if(d.a==='up'&&i>0){[a[i-1],a[i]]=[a[i],a[i-1]];}else if(d.a==='dn'&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];}dirty();render();return;}
 if(d.add){const s=d.add;S[s].push(newBlock($('#add_'+s).value));dirty();render();return;}
 if(t.id==='cadd'){const L=['PRIMERA:','SEGUNDA:','TERCERA:','CUARTA:','QUINTA:','SEXTA:','SÉPTIMA:','OCTAVA:'];S.conclusiones.push({label:L[S.conclusiones.length]||'NUEVA:',text:''});dirty();render();return;}
 if(d.cdel!=null){S.conclusiones.splice(+d.cdel,1);dirty();render();return;}
 if(d.rot){await rotImg(d.rot);dirty();render();return;}
 if(d.rm){if(confirm('¿Quitar la imagen?')){delete S.imgs[d.rm];dirty();render();}return;}
 if(t.id==='gIns'){const bl=gpxBlocks();if(!bl.length){alert('Selecciona al menos un punto.');return;}S.resultados.push(...bl);dirty();log('Tablas del GPX insertadas al final de Resultados; reordénalas en Contenido.','ok');TAB='cont';render();return;}
 if(t.id==='g06'){genF06();return;}if(t.id==='g82'){genF82();return;}if(t.id==='gBoth'){await genF06();await genF82();return;}
 if(t.id==='cpMail'){const m=emailText();try{await navigator.clipboard.writeText('Asunto: '+m.asunto+'\n\n'+m.cuerpo);log('Texto del correo copiado.','ok');}catch(e){log('No se pudo copiar; selecciónalo manualmente.','warn');}return;}
 if(t.id==='exp'){const b=new Blob([JSON.stringify(S)],{type:'application/json'});dl(b,'caso_MT'+(S.mt||'sin-numero')+'.json');return;}
 if(d.open){const v=await idbGet(d.open);if(v){S=Object.assign(newState(),v);TAB='caso';render();}return;}
 if(d.delc){if(confirm('¿Borrar este caso del equipo?')){await idbDel(d.delc);listCasos();}return;}
});
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.ipn){const k=t.dataset.ipn;S.ipat.items[k]=Object.assign({s:'',n:''},S.ipat.items[k],{n:t.value});dirty();return;}
 if(t.dataset.iht!=null){S.ipat.hall[+t.dataset.iht].t=t.value;dirty();return;}
 if(t.id==='ipreg'){S.ipat.preg=t.value;dirty();return;}
 if(t.dataset.p){setp(t.dataset.p,t.value);if(t.dataset.p==='mt'&&!S.informe)S.informe='';dirty();return;}
 if(t.id==='labores'){S.labores=t.value.split(/\n\s*\n/).slice(0,4);dirty();return;}
 if(t.id==='anexos'){S.anexos=t.value.split('\n');dirty();return;}
 if(t.id==='enc'){cfgSet('encuesta',t.value);refreshMail();return;}
 if(t.dataset.ct!=null){S.conclusiones[+t.dataset.ct].text=t.value;dirty();return;}
 if(t.dataset.chk){S.chk[t.dataset.chk]=t.checked;dirty();return;}
 if(t.dataset.gu!=null){S.gpx[+t.dataset.gu].use=t.checked;return;}if(t.dataset.gn!=null){S.gpx[+t.dataset.gn].name=t.value;return;}if(t.dataset.gs!=null){S.gpx[+t.dataset.gs].src=t.value;return;}
 const blk=t.closest('.blk');if(blk&&blk.dataset.s&&t.dataset.f){const b=S[blk.dataset.s][+blk.dataset.i];const j=t.closest('[data-j]')?t.closest('[data-j]').dataset.j:t.dataset.j;let v=t.value;if(t.type==='number')v=+v;if(b.t==='pair'&&j!=null){b.items[+j][t.dataset.f]=v;}else{b[t.dataset.f]=v;if(t.dataset.f==='hdrTxt'||t.dataset.f==='rowsTxt'||t.dataset.f==='widthsTxt'){/* se reconstruye al generar */}}dirty();}
});
document.addEventListener('change',async ev=>{const t=ev.target;
 if(t.dataset.ip){const k=t.dataset.ip;S.ipat.items[k]=Object.assign({s:'',n:''},S.ipat.items[k],{s:t.value});dirty();return;}
 if(t.dataset.ihp!=null){S.ipat.hall[+t.dataset.ihp].p=t.value;dirty();return;}
 if(t.id==='tipo'){S.tipo=t.value;dirty();render();return;}
 if(t.id==='fimg'){await addImgs(Array.from(t.files));return;}
 if(t.id==='fdir'||t.id==='ffil'){await ingest(t.files);return;}
 if(t.id==='fgpx'){try{S.gpx=parseGPX(await t.files[0].text());dirty();log('GPX leído: '+S.gpx.length+' waypoints.','ok');render();}catch(e){alert(e.message);}return;}
 if(t.id==='imp'){try{const o=JSON.parse(await t.files[0].text());S=Object.assign(newState(),o);dirty();TAB='caso';render();log('Paquete importado.','ok');}catch(e){alert('Archivo inválido: '+e.message);}return;}
 const blk=t.closest('.blk');if(blk&&blk.dataset.s&&t.tagName==='SELECT'){render();}
});
/* ---------- arranque ---------- */
async function boot(){try{PRESETS=await (await fetch('presets.json')).json();}catch(e){document.body.insertAdjacentHTML('afterbegin','<p class="bad">No se pudieron cargar las plantillas: '+esc(e)+'</p>');return;}
 const s=await idbGet('actual');if(s)S=Object.assign(newState(),s);
 if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
 render();setTimeout(()=>{engine().catch(()=>{});},1500);}
boot();
</script></body></html>
